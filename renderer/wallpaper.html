<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wallpaper</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        cursor: default;
      }
      video,
      img,
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./wallpaper/main.ts"></script>
  </body>
</html>

name: Platforms

# Builds and tests the island on each OS it supports. The Linux suites (Xvfb,
# X11, D-Bus) run in ci.yml; here the real app is launched on macOS and Windows.
on:
  push:
    branches: [windows]
  workflow_dispatch:

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Launch the app (smoke test)
        run: node e2e/smoke.cjs
        env:
          SHOTS: shots
      - name: Build the installer (as in the README)
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: shots
          if-no-files-found: ignore

  # What a Windows user does: run the installer, open the app, use it, then
  # uninstall it, checking nothing is left behind.
  install:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the installer (as in the README)
        run: npm run package
      - name: Install it like a user (per user, no admin)
        run: |
          $setup = Get-ChildItem dist\*.exe | Select-Object -First 1
          Write-Host "Installer: $($setup.Name)"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          # Where Windows says it is (Settings > Apps reads the same entry).
          $entry = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -like 'Dynamic Island*' | Select-Object -First 1
          if (-not $entry) { throw "not in Installed apps" }
          # Its folder is where its uninstaller is.
          $uninstaller = [regex]::Match($entry.UninstallString, '"([^"]+)"').Groups[1].Value
          $dir = Split-Path $uninstaller
          Write-Host "Installed apps: $($entry.DisplayName) $($entry.DisplayVersion), in $dir"
          $exe = Join-Path $dir 'DynamicIsland.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem $dir | Select-Object Name; throw "no DynamicIsland.exe" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "Dynamic Island*.lnk"
          if (-not $lnk) { throw "no Start menu shortcut" }
          Write-Host "Start menu: $($lnk.FullName)"
          "APP_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: The installed app works
        run: |
          $env:APP_PATH = $env:APP_EXE
          node e2e/smoke.cjs
        env:
          SHOTS: shots
      - name: Opening it from the Start menu shows the island
        run: |
          Start-Process $env:APP_EXE
          Start-Sleep 10
          Get-Process DynamicIsland | Select-Object -First 1 Id, ProcessName
          if (-not (Test-Path "$env:APPDATA\dynamic-island-linux")) { throw "no data folder" }
      - name: Uninstall removes everything
        run: |
          $exe = $env:APP_EXE
          # Turn on what uninstall must undo: Claude Code approvals.
          $env:ELECTRON_RUN_AS_NODE = '1'
          & $exe (Join-Path $env:APP_DIR 'resources\hook\install.cjs')
          # Claude Code's settings file, found the same way the installer does.
          $claude = & $exe -e "process.stdout.write(require('path').join(process.env.CLAUDE_CONFIG_DIR || require('os').homedir(), process.env.CLAUDE_CONFIG_DIR ? '' : '.claude', 'settings.json'))"
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          Write-Host "Claude Code settings: $claude"
          Select-String -Path $claude -Pattern claude-island | Select-Object -First 1
          # Same as Uninstall... in the tray menu, with "delete my data" ticked.
          & $exe --uninstall --yes --delete-data
          for ($i = 0; $i -lt 60; $i++) { if (-not (Test-Path $exe) -and -not (Get-Process DynamicIsland -ErrorAction SilentlyContinue)) { break }; Start-Sleep 1 }
          Start-Sleep 3
          $failed = $false
          function Check($name, $ok) { if ($ok) { Write-Host "ok: $name" } else { Write-Host "FAILED: $name"; $script:failed = $true } }
          Check "app removed" (-not (Test-Path $exe))
          Check "settings and data removed" (-not (Test-Path "$env:APPDATA\dynamic-island-linux"))
          Check "Start menu shortcut removed" (-not (Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "Dynamic Island*.lnk"))
          Check "not in Installed apps" (-not (Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -like 'Dynamic Island*'))
          Check "Claude Code hook removed" (-not (Select-String -Path $claude -Pattern claude-island -Quiet))
          Check "not running any more" (-not (Get-Process DynamicIsland -ErrorAction SilentlyContinue))
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-test-windows
          path: shots
          if-no-files-found: ignore

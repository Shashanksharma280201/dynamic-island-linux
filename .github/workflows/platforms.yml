name: Platforms

# Builds and tests the island on each OS it supports. The Linux suites (Xvfb,
# X11, D-Bus) run in ci.yml; here the real app is launched on macOS and Windows.
on:
  push:
    branches: [mac]
  workflow_dispatch:

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Launch the app (smoke test)
        run: node e2e/smoke.cjs
        env:
          SHOTS: shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: shots
          if-no-files-found: ignore

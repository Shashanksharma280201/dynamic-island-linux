name: Platforms

# Builds and tests the island on each OS it supports. The Linux suites (Xvfb,
# X11, D-Bus) run in ci.yml; here the real app is launched on macOS and Windows.
on:
  push:
    branches: [mac]
  workflow_dispatch:

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Launch the app (smoke test)
        run: node e2e/smoke.cjs
        env:
          SHOTS: shots
      - name: Build the installer (as in the README)
        run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no signing certificate
      - name: Signed with a Developer ID, it still runs (hardened runtime, our entitlements)
        # A real certificate isn't available here; an ad-hoc signature with the
        # same options shows the app works under the rules notarization needs.
        timeout-minutes: 10
        run: |
          APP=$(ls -d dist/mac*/"Dynamic Island.app" | head -1)
          codesign --force --deep --sign - --options runtime --entitlements assets/entitlements.mac.plist "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "flags=.*runtime"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -E "audio-input|apple-events|allow-jit"
          rc=0
          perl -e 'alarm shift @ARGV; exec @ARGV' 300 node e2e/smoke.cjs > smoke-hardened.log 2>&1 || rc=$?
          # What happened, readable without the log.
          echo "::notice title=Hardened runtime smoke test (exit $rc)::$(tail -40 smoke-hardened.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          exit $rc
        env:
          APP_PATH: ${{ github.workspace }}/dist/mac-arm64/Dynamic Island.app/Contents/MacOS/Dynamic Island
          SHOTS: shots-hardened
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: shots
          if-no-files-found: ignore

  # What a Mac user does: download the .dmg, drag the app to Applications,
  # open it, use it, then uninstall it, checking nothing is left behind.
  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the .dmg (as in the README)
        run: npm run package
      - name: Download and install it like a user
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          echo "Installer: $DMG"
          # Mark it as downloaded from the internet, as a browser does.
          xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" "$DMG"
          MNT=$(hdiutil attach -nobrowse -readonly "$DMG" | grep -o '/Volumes/.*' | head -1)
          echo "Opened: $MNT"; ls "$MNT"
          test -L "$MNT/Applications" # the drag-to-Applications shortcut
          ditto "$MNT/Dynamic Island.app" "/Applications/Dynamic Island.app"
          hdiutil detach "$MNT"
      - name: The app is signed, so macOS doesn't call it damaged
        run: |
          APP="/Applications/Dynamic Island.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|Signature|flags"
          spctl --assess --type execute -vv "$APP" 2>&1 || echo "Gatekeeper: not notarized, as expected (users click Open Anyway once)"
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$APP/Contents/Info.plist"
          xattr -dr com.apple.quarantine "$APP" # the Open Anyway step, for the automated run
      - name: The installed app works
        run: node e2e/smoke.cjs
        env:
          APP_PATH: /Applications/Dynamic Island.app/Contents/MacOS/Dynamic Island
          SHOTS: shots
      - name: Opening it from Applications shows the island
        run: |
          open -a "Dynamic Island"
          sleep 10
          screencapture -x shots/desktop.png || true
          if [ -f shots/desktop.png ]; then sips -Z 1000 -s format jpeg -s formatOptions 55 shots/desktop.png --out shots/desktop.jpg >/dev/null; echo "SHOT_BASE64 $(base64 -i shots/desktop.jpg | tr -d '\n')"; fi
          pgrep -fl "Dynamic Island.app/Contents/MacOS" | head -1
          # Electron keeps its data under the package name.
          test -d ~/Library/Application\ Support/dynamic-island-linux
      - name: Uninstall removes everything
        run: |
          APP="/Applications/Dynamic Island.app"
          # Turn on what uninstall must undo: Claude Code approvals and status line.
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/Dynamic Island" "$APP/Contents/Resources/hook/install.cjs"
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/Dynamic Island" "$APP/Contents/Resources/hook/statusline.cjs"
          grep -c claude-island ~/.claude/settings.json
          # Same as Uninstall… in the menu bar, with "delete my data" ticked.
          "$APP/Contents/MacOS/Dynamic Island" --uninstall --yes --delete-data
          for i in $(seq 1 30); do pgrep -f "Dynamic Island.app" >/dev/null || break; sleep 1; done
          # Let the finishing step (it runs after the island quits) complete.
          sleep 6
          FAILED=0
          check() { if eval "$2"; then echo "ok: $1"; else echo "FAILED: $1"; FAILED=1; fi; }
          check "app removed from Applications" '[ ! -e "$APP" ]'
          check "app is in the Trash" 'ls ~/.Trash | grep -q "Dynamic Island"'
          check "settings and data removed" '[ ! -e ~/Library/Application\ Support/dynamic-island-linux ]'
          check "Claude Code hook and status line removed" '! grep -q claude-island ~/.claude/settings.json'
          check "not running any more" '! pgrep -f "Dynamic Island.app" >/dev/null'
          LEFT=$(find ~/Library -maxdepth 3 \( -iname "*dynamic island*" -o -iname "*dynamicisland*" -o -iname "*dynamic-island*" \) 2>/dev/null)
          echo "leftovers: ${LEFT:-none}"
          check "nothing left in ~/Library" '[ -z "$LEFT" ]'
          echo "--- what the uninstall's last step did:"; cat "$(getconf DARWIN_USER_TEMP_DIR)"dynamic-island-uninstall-*/dynamic-island-uninstall.log 2>/dev/null || true
          exit $FAILED
      - name: The .pkg, downloaded in a browser, installs and opens
        # The Installer doesn't pass the download's quarantine on to the app,
        # so there's no "damaged" message; its script hands the app to the
        # user and starts it.
        run: |
          PKG=$(ls dist/*.pkg | head -1)
          echo "Installer: $PKG"
          xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" "$PKG"
          sudo installer -pkg "$PKG" -target /
          APP="/Applications/Dynamic Island.app"
          FAILED=0
          check() { if eval "$2"; then echo "ok: $1"; else echo "FAILED: $1"; FAILED=1; fi; }
          check "installed in Applications" '[ -d "$APP" ]'
          check "owned by the user, not root" '[ "$(stat -f %Su "$APP")" = "$USER" ]'
          check "no quarantine on the app" '! xattr -p com.apple.quarantine "$APP" >/dev/null 2>&1'
          check "signature valid" 'codesign --verify --deep --strict "$APP"'
          for i in $(seq 1 30); do pgrep -f "Dynamic Island.app/Contents/MacOS/" >/dev/null && break; sleep 1; done
          check "the installer started it" 'pgrep -f "Dynamic Island.app/Contents/MacOS/" >/dev/null'
          sleep 4
          "$APP/Contents/MacOS/Dynamic Island" --uninstall --yes --delete-data || true
          for i in $(seq 1 30); do pgrep -f "Dynamic Island.app/Contents/MacOS/" >/dev/null || break; sleep 1; done
          sleep 6
          check "its Uninstall removes it without a password" '[ ! -e "$APP" ]'
          exit $FAILED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-test-macos
          path: shots
          if-no-files-found: ignore

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build the .deb and AppImage
        run: npm run package

  e2e:
    runs-on: ubuntu-latest
    # A run takes about 12 minutes; a hang fails instead of running for hours.
    timeout-minutes: 30
    env:
      ELECTRON_DISABLE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb dbus libglib2.0-bin
      - run: npm ci
      - run: npm run test:e2e
      - name: e2e on a simulated HiDPI (2x) display
        run: xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- sh -c "node e2e/run.cjs && node e2e/messages.cjs && node e2e/claude.cjs && node e2e/agent.cjs && node e2e/spotify.cjs && node e2e/docs.cjs && node e2e/crm.cjs && node e2e/notifications.cjs && node e2e/sessions.cjs && node e2e/ease.cjs && node e2e/services.cjs && node e2e/recap.cjs"
        env:
          E2E_SCALE: '2'
      - name: drag actions on a simulated HiDPI (2x) display
        # The ring needs a screen a little bigger than 1080p at 2x.
        run: xvfb-run -a -s "-screen 0 3840x2160x24" dbus-run-session -- node e2e/drag.cjs
        env:
          E2E_SCALE: '2'

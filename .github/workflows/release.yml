name: Release

# Builds the installers on each OS, from that OS's branch (main for Linux,
# mac, windows), and publishes them as one GitHub release. Run it from the
# Actions tab (Run workflow, with the version tag) or by pushing a v* tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, e.g. v0.1.0
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            branch: main
            package: npm run package
          - os: macos-latest
            branch: mac
            # Apple silicon and Intel
            package: npm run build && npx electron-builder --mac dmg --arm64 --x64 --publish never
          - os: windows-latest
            branch: windows
            package: npm run package
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.package }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no signing certificate
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.branch }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: main
          name: Dynamic Island ${{ inputs.tag || github.ref_name }}
          files: installers/*
          body: |
            Dynamic Island for Linux, macOS and Windows. Download the file for your computer:

            | Your computer | File |
            |---|---|
            | Ubuntu, Debian | `dynamic-island-linux-…-amd64.deb`: `sudo apt install ./dynamic-island-linux-*-amd64.deb` |
            | Any Linux (X11) | `dynamic-island-linux-…-x86_64.AppImage`: `chmod +x` it, then run it |
            | Mac with Apple silicon (M1 and newer) | `dynamic-island-linux-…-arm64.dmg` |
            | Mac with Intel | `dynamic-island-linux-…-x64.dmg` |
            | Windows 10 or 11 | `dynamic-island-linux-…-x64.exe` |

            **Mac:** open the `.dmg` and drag Dynamic Island to Applications. The app isn't signed, so the first time macOS blocks it: open **System Settings → Privacy & Security** and click **Open Anyway**.

            **Windows:** run the `.exe`. The installer isn't signed, so SmartScreen may warn: click **More info**, then **Run anyway**.

            Each installer is built from its branch (`main`, `mac`, `windows`). The [README](https://github.com/shashanksharma280201/dynamic-island-linux#readme) has a video tour, the steps to build it yourself, and how to connect Claude Code, WhatsApp, mail and Spotify.

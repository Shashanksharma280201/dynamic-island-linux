name: Release

# Builds the installers on each OS, from that OS's branch (main for Linux,
# mac, windows), and publishes them as one GitHub pre-release with checksums
# and notes from CHANGELOG.md. Then installs it with the one-line install
# scripts on every OS, starts it and uninstalls it, and only then makes it the
# latest release (the one people get). Run it from the Actions tab (Run
# workflow, with the version tag) or by pushing a v* tag. First bump "version"
# in package.json (on main, then merge into mac and windows) and add the
# version's section to CHANGELOG.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, e.g. v0.2.0
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            branch: main
            package: npm run package
          - os: macos-latest
            branch: mac
            # Apple silicon and Intel: the .dmg, and the .pkg that installs
            # without macOS calling the app damaged. With a Developer ID (the
            # MAC_CERT_P12 secret and the others in docs/mac-signing.md) the
            # app is signed and notarized instead, and the .dmg is all it needs.
            package: npm run build && npx electron-builder --mac dmg pkg --arm64 --x64 --publish never
          - os: windows-latest
            branch: windows
            package: npm run package
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: The version matches the tag
        shell: bash
        run: |
          have=$(node -p "require('./package.json').version")
          if [ "v$have" != "$TAG" ]; then
            echo "::error::package.json on ${{ matrix.branch }} says $have, but this release is $TAG. Bump the version (and merge it into mac and windows) first."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the installers
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no signing certificate, unless the Mac one below is set
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CERT_P12" ]; then
            for v in MAC_CERT_PASSWORD MAC_APPLE_ID MAC_APP_PASSWORD MAC_TEAM_ID; do
              [ -n "${!v}" ] || { echo "::error::MAC_CERT_P12 is set but ${v#MAC_} isn't: see docs/mac-signing.md"; exit 1; }
            done
            echo "Signing with team $MAC_TEAM_ID's Developer ID certificate, then notarizing"
            export CSC_LINK="$MAC_CERT_P12" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            export APPLE_ID="$MAC_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$MAC_APP_PASSWORD" APPLE_TEAM_ID="$MAC_TEAM_ID"
            unset CSC_IDENTITY_AUTO_DISCOVERY
            npm run build
            npx electron-builder --mac dmg --arm64 --x64 --publish never -c.mac.identity="$MAC_TEAM_ID"
            # Gatekeeper must accept it as downloaded, or people get "damaged".
            for app in dist/mac*/*.app; do
              spctl --assess --type execute -vv "$app"
              xcrun stapler validate "$app"
            done
          else
            ${{ matrix.package }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.branch }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
            dist/*.pkg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Name the files for people, and checksum them
        # scripts/install.sh and install.ps1 download the files by these
        # names: change them together.
        run: |
          VER="${TAG#v}"
          cd installers
          ls -la
          for f in *; do
            case "$f" in
              *"$VER"*) ;;
              *) echo "::error::$f wasn't built as version $VER"; exit 1 ;;
            esac
            case "$f" in
              *-amd64.deb | *-x86_64.AppImage) new="$f" ;;
              *-arm64.dmg) new="dynamic-island-mac-MSeries-$VER-arm64.dmg" ;;
              *-x64.dmg) new="dynamic-island-mac-intel-$VER-x64.dmg" ;;
              *-arm64.pkg) new="dynamic-island-mac-MSeries-$VER-arm64.pkg" ;;
              *-x64.pkg) new="dynamic-island-mac-intel-$VER-x64.pkg" ;;
              *.exe) new="dynamic-island-windows-$VER-x64.exe" ;;
              *) echo "::error::unexpected file: $f"; exit 1 ;;
            esac
            if [ "$f" != "$new" ]; then mv -v "$f" "$new"; fi
          done
          for f in "dynamic-island-linux-$VER-amd64.deb" "dynamic-island-linux-$VER-x86_64.AppImage" \
            "dynamic-island-mac-MSeries-$VER-arm64.dmg" "dynamic-island-mac-intel-$VER-x64.dmg" \
            "dynamic-island-windows-$VER-x64.exe"; do
            [ -s "$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          VER="${TAG#v}"
          new=$(awk -v v="$VER" '$0 ~ "^## " v "( |$)" { f = 1; next } /^## / && f { exit } f' CHANGELOG.md)
          if [ -z "$(printf '%s' "$new" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for $VER (a heading like '## $VER (date)')"
            exit 1
          fi
          dl="https://github.com/${{ github.repository }}/releases/download/$TAG"
          # Unsigned Mac builds come with a .pkg (signed ones don't need one).
          pkg=""; [ -e "installers/dynamic-island-mac-MSeries-$VER-arm64.pkg" ] && pkg=1
          mac() { # $1 = MSeries|intel, $2 = arm64|x64
            local d="dynamic-island-mac-$1-$VER-$2.dmg" p="dynamic-island-mac-$1-$VER-$2.pkg"
            if [ -n "$pkg" ]; then echo "[$p]($dl/$p) (or the [.dmg]($dl/$d))"; else echo "[$d]($dl/$d)"; fi
          }
          raw="https://raw.githubusercontent.com/${{ github.repository }}/main/scripts"
          {
            echo "## What's new"
            echo
            printf '%s\n' "$new"
            echo
            echo "## Install"
            echo
            echo "**One command** downloads the right installer for your computer, checks it, installs it and starts it:"
            echo
            echo "- **Linux or Mac**, in Terminal: \`curl -fsSL $raw/install.sh | bash\`"
            echo "- **Windows**, in PowerShell: \`irm $raw/install.ps1 | iex\`"
            echo
            echo "**Or download the file for your computer:**"
            echo
            echo "| Your computer | File |"
            echo "|---|---|"
            echo "| Ubuntu, Debian | [dynamic-island-linux-$VER-amd64.deb]($dl/dynamic-island-linux-$VER-amd64.deb), then \`sudo apt install ./dynamic-island-linux-$VER-amd64.deb\` |"
            echo "| Any Linux (X11) | [dynamic-island-linux-$VER-x86_64.AppImage]($dl/dynamic-island-linux-$VER-x86_64.AppImage), then \`chmod +x\` it and run it |"
            echo "| Mac with Apple silicon (M1 and newer) | $(mac MSeries arm64) |"
            echo "| Mac with Intel | $(mac intel x64) |"
            echo "| Windows 10 or 11 | [dynamic-island-windows-$VER-x64.exe]($dl/dynamic-island-windows-$VER-x64.exe) |"
            echo
            if [ -n "$pkg" ]; then
              echo "**Mac:** the one command above is the easiest. Or open the \`.pkg\`: when macOS says it can't verify it, open **System Settings → Privacy & Security**, click **Open Anyway**, and install; the island starts by itself. With the \`.dmg\` instead, after dragging the app to Applications run \`xattr -dr com.apple.quarantine \"/Applications/Dynamic Island.app\"\` once in Terminal, or macOS says it's damaged (the app isn't signed with an Apple Developer ID yet)."
            else
              echo "**Mac:** open the \`.dmg\` and drag Dynamic Island to Applications. It's signed and notarized by Apple."
            fi
            echo
            echo "**Windows:** the installer isn't signed: if SmartScreen warns, click **More info**, then **Run anyway**. The one-command install skips that."
            echo
            echo "\`SHA256SUMS.txt\` lists each file's checksum: \`sha256sum -c SHA256SUMS.txt --ignore-missing\` (Mac: \`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\`)."
            echo
            echo "**To remove it**, open the island's menu and choose **Uninstall Dynamic Island…**. The [README](https://github.com/${{ github.repository }}#readme) has a video tour, the steps to build it yourself, and how to connect Claude Code, WhatsApp, mail and Spotify."
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: main
          name: Dynamic Island ${{ env.TAG }}
          body_path: notes.md
          files: installers/*
          # Until the install test below passes, the latest release (what the
          # one-line install gets) stays the previous one.
          prerelease: true

  verify:
    # Install the release that was just published, on every OS, the way the
    # README says to.
    needs: release
    uses: ./.github/workflows/install-test.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  promote:
    # It installs, starts and uninstalls everywhere: make it the latest.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease=false --latest

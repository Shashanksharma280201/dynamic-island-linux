name: Island Drop (Android)

# Builds the Island Drop app (mobile/) into an APK you can install on your
# phone: download it from the run's artifacts. Given a release's tag (the
# Release workflow passes it, or run this with one), it's added to that
# release as island-drop.apk, with its checksum in SHA256SUMS.txt.
on:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      release:
        description: Add the APK to this release (its tag, e.g. v0.5.0); leave empty for just the artifact
        required: false
        default: ''
  workflow_call:
    inputs:
      release:
        type: string
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Make the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Name it
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk island-drop.apk
          echo "::notice title=island-drop.apk::$(du -h island-drop.apk | cut -f1), built from ${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: island-drop-apk
          path: mobile/island-drop.apk
      - name: Add it to the release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          gh release upload "$TAG" island-drop.apk --clobber --repo "${{ github.repository }}"
          # Its checksum next to the installers' (the line replaced if it's there already).
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir sums --repo "${{ github.repository }}" || mkdir -p sums
          touch sums/SHA256SUMS.txt
          grep -v ' island-drop.apk$' sums/SHA256SUMS.txt > sums/next.txt || true
          sha256sum island-drop.apk >> sums/next.txt
          mv sums/next.txt sums/SHA256SUMS.txt
          gh release upload "$TAG" sums/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
          echo "::notice title=island-drop.apk::added to $TAG"


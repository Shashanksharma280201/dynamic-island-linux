name: Island Drop (Android)

# Builds the Island Drop app (mobile/) into an APK you can install on your
# phone: download it from the run's artifacts.
on:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Make the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Name it
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk island-drop.apk
          echo "::notice title=island-drop.apk::$(du -h island-drop.apk | cut -f1), built from ${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: island-drop-apk
          path: mobile/island-drop.apk

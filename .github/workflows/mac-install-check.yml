name: Mac install check

# Every way a person installs the island on a Mac, on several macOS versions
# and on Intel: the one-line command from the README, the .dmg downloaded in a
# browser (what Gatekeeper says about it), and building it from the code with
# only the Command Line Tools (no Xcode).
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mac-install-check.yml

permissions:
  contents: read

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: This Mac
        run: |
          sw_vers
          uname -m
          spctl --status || true
          xcode-select -p || true
          ls /Library/Developer/CommandLineTools/usr/bin/git /Applications/Xcode*.app 2>&1 | head -5 || true

      - name: One-line install, exactly as in the README
        id: oneline
        continue-on-error: true
        run: |
          curl -fsSL https://raw.githubusercontent.com/shashanksharma280201/dynamic-island-linux/main/scripts/install.sh | DI_NO_LAUNCH=1 bash
          APP="/Applications/Dynamic Island.app"
          test -d "$APP"
          xattr -l "$APP" || true
          codesign --verify --deep --strict --verbose=2 "$APP"
          open "$APP"
          for i in $(seq 1 30); do pgrep -f "Dynamic Island.app/Contents/MacOS/" >/dev/null && break; sleep 1; done
          sleep 6
          pgrep -fl "Dynamic Island.app/Contents/MacOS/" | head -3
          pgrep -f "Dynamic Island.app/Contents/MacOS/" >/dev/null
          osascript -e 'quit app "Dynamic Island"' || true
          sleep 2; pkill -f "Dynamic Island.app/Contents/MacOS/" || true
          rm -rf "$APP"

      - name: Downloaded in a browser, dragged to Applications, double-clicked
        id: browser
        continue-on-error: true
        run: |
          case "$(uname -m)" in arm64) F=dynamic-island-mac-MSeries-0.2.0-arm64.dmg ;; *) F=dynamic-island-mac-intel-0.2.0-x64.dmg ;; esac
          curl -fsSL -o "$RUNNER_TEMP/$F" "https://github.com/shashanksharma280201/dynamic-island-linux/releases/download/v0.2.0/$F"
          # What Safari or Chrome puts on a download.
          xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" "$RUNNER_TEMP/$F"
          MNT=$(hdiutil attach -nobrowse -readonly "$RUNNER_TEMP/$F" | grep -o '/Volumes/.*' | head -1)
          ls -la "$MNT"
          ditto "$MNT/Dynamic Island.app" "/Applications/Dynamic Island.app"
          hdiutil detach "$MNT"
          APP="/Applications/Dynamic Island.app"
          xattr -l "$APP" | head -3
          # Each finding as an annotation (readable without the log).
          note() { printf '::notice title=%s::%s\n' "$1" "$(printf '%s' "$2" | head -c 3000 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; }
          note "codesign" "$(codesign -dvv "$APP" 2>&1 | grep -E "Identifier|Signature|TeamIdentifier|flags|Authority"; codesign --verify --deep --strict --verbose=2 "$APP" 2>&1)"
          note "spctl (Gatekeeper)" "$(spctl --status 2>&1); $(spctl --assess --type execute -vvv "$APP" 2>&1)"
          note "syspolicy_check" "$(syspolicy_check distribution "$APP" 2>&1 | head -30)"
          open "$APP" 2>&1 || true
          sleep 12
          if pgrep -f "Dynamic Island.app/Contents/MacOS/" >/dev/null; then r="it opened"; else r="macOS blocked it"; fi
          note "double-click: $r" "$(log show --last 2m --style compact --predicate 'subsystem == "com.apple.syspolicy" OR process == "syspolicyd" OR process == "CoreServicesUIAgent"' 2>/dev/null | grep -i -E "dynamic|island|notar|damaged|malware|assess|adhoc|ad-hoc" | tail -20)"
          pkill -f "Dynamic Island.app/Contents/MacOS/" || true
          rm -rf "$APP"

      - name: The same app as a .pkg, downloaded in a browser and installed
        id: pkg
        continue-on-error: true
        run: |
          note() { printf '::notice title=%s::%s\n' "$1" "$(printf '%s' "$2" | head -c 3000 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; }
          case "$(uname -m)" in arm64) F=dynamic-island-mac-MSeries-0.2.0-arm64.dmg ;; *) F=dynamic-island-mac-intel-0.2.0-x64.dmg ;; esac
          curl -fsSL -o "$RUNNER_TEMP/clean.dmg" "https://github.com/shashanksharma280201/dynamic-island-linux/releases/download/v0.2.0/$F"
          MNT=$(hdiutil attach -nobrowse -readonly "$RUNNER_TEMP/clean.dmg" | grep -o '/Volumes/.*' | head -1)
          mkdir -p "$RUNNER_TEMP/root"
          ditto "$MNT/Dynamic Island.app" "$RUNNER_TEMP/root/Dynamic Island.app"
          hdiutil detach "$MNT"
          pkgbuild --component "$RUNNER_TEMP/root/Dynamic Island.app" --install-location /Applications --identifier io.github.shashanksharma280201.dynamicisland "$RUNNER_TEMP/DI.pkg"
          xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" "$RUNNER_TEMP/DI.pkg"
          note "pkg: spctl (Gatekeeper)" "$(spctl --assess --type install -vvv "$RUNNER_TEMP/DI.pkg" 2>&1)"
          sudo installer -pkg "$RUNNER_TEMP/DI.pkg" -target /
          APP="/Applications/Dynamic Island.app"
          q=$(xattr -p com.apple.quarantine "$APP" 2>&1 || true)
          note "pkg: installed app" "quarantine: $q; $(spctl --assess --type execute -vv "$APP" 2>&1); $(codesign --verify --deep --strict "$APP" 2>&1 && echo signature ok)"
          open "$APP"
          for i in $(seq 1 30); do pgrep -f "Dynamic Island.app/Contents/MacOS/" >/dev/null && break; sleep 1; done
          sleep 6
          if pgrep -f "Dynamic Island.app/Contents/MacOS/" >/dev/null; then note "pkg: it opened" "ok"; else note "pkg: it did not open" "-"; exit 1; fi
          pkill -f "Dynamic Island.app/Contents/MacOS/" || true
          sudo rm -rf "$APP"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build from the code with only the Command Line Tools (no Xcode)
        id: source
        continue-on-error: true
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools
          xcode-select -p
          node -v
          git clone -q -b mac https://github.com/shashanksharma280201/dynamic-island-linux.git "$RUNNER_TEMP/di"
          cd "$RUNNER_TEMP/di"
          npm install --no-audit --no-fund 2>&1 | tail -15
          npm run build 2>&1 | tail -5
          CSC_IDENTITY_AUTO_DISCOVERY=false npm run package 2>&1 | tail -15
          ls -la dist/*.dmg

      - name: Summary
        if: always()
        run: |
          echo "::notice title=$(sw_vers -productVersion) $(uname -m)::one-line=${{ steps.oneline.outcome }} browser=${{ steps.browser.outcome }} pkg=${{ steps.pkg.outcome }} from-source=${{ steps.source.outcome }}"
          [ "${{ steps.oneline.outcome }}" = success ] && [ "${{ steps.source.outcome }}" = success ]
